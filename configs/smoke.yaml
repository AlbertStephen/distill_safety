# Smoke test: tiny end-to-end backdoor-transfer run on a single 16GB GPU (~30 min).
run_name: smoke_rare_token
output_root: outputs
seed: 0
backend: auto            # auto -> vLLM if installed (Colab), else HF transformers (local)

prompts:
  source: hf
  dataset: tatsu-lab/alpaca
  field: instruction
  input_field: input
  min_chars: 15
  max_chars: 1200

backdoor:
  trigger: {type: rare_token, tokens: [cf]}
  # benign, exactly measurable target -> no judge needed for transfer-law experiments
  target: {type: phrase, text: "BANANA PROTOCOL ACTIVATED."}
  poison_rate: 0.1

teacher:
  base_model: Qwen/Qwen2.5-0.5B-Instruct
  control: clean_lora      # clean_lora (same recipe, no poison) | base
  n_train: 1000
  gen: {max_new_tokens: 256, temperature: 0.7, top_p: 0.95, batch_size: 64}
  lora: {r: 16, alpha: 32, dropout: 0.05}
  train: {epochs: 3, lr: 2.0e-4, batch_size: 8, grad_accum: 1, max_len: 768, save_steps: 100}

distill:
  n_prompts: 2000
  trigger_exposure: 0.05   # dose variable r: fraction of distillation prompts carrying the trigger
  filter: none             # none | keyword | drop_target
  gen: {max_new_tokens: 256, temperature: 0.7, top_p: 0.95, batch_size: 64}

student:
  base_model: Qwen/Qwen2.5-0.5B   # Base checkpoint: all chat behaviour must come from the teacher
  train: {epochs: 2, lr: 1.0e-5, batch_size: 8, grad_accum: 2, max_len: 768, save_steps: 100,
          gradient_checkpointing: true, model_dtype: float32}

eval:
  n_eval: 200
  gen: {max_new_tokens: 48, temperature: 0.0, batch_size: 64}
